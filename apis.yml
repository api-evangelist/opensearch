aid: opensearch
name: OpenSearch
description: OpenSearch is the open source, community-driven search, analytics, and
  observability suite (forked from Elasticsearch and Kibana) maintained under the
  Linux Foundation's OpenSearch Software Foundation. The platform exposes REST APIs
  across the search engine, the OpenSearch Dashboards UI, and a set of plugins. The
  Security plugin REST API lets administrators programmatically create and manage
  internal users, roles, role mappings, action groups, tenants, security configuration,
  audit log configuration, and SSL certificates.
type: Index
accessModel:
  pricing: freemium
  onboarding: self-serve
  trial: false
  try_now: true
  public: false
  label: Freemium · Self-serve signup
  confidence: high
  source:
